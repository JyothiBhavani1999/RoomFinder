<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add room</title>
</head>
<body>
<h1>Add a New Room</h1>
<form action="/api/add-room" method = "post">
    <label> City:</label>
    <input type="text" name="city" required><br><br>

    <label> Address:</label>
    <input type="text" name="address" required><br><br>

    <label> Rent:</label>
    <input type="text" name="rent" required><br><br>

    <button type="submit"> Add Room </button>
</form>
</body>
</html>

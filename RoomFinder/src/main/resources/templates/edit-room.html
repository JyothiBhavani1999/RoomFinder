<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Edit room</title>
</head>
<body>
<h1>Edit Room Details</h1>
<form th:action="@{/update-room}" th:object="${room}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <label> City:</label>
    <input type="text" name="city" th:field="*{city}" required><br><br>

    <label> Address:</label>
    <input type="text" name="address" th:field="*{address}" required><br><br>

    <label> Rent:</label>
    <input type="text" name="rent" th:field="*{rent}" required><br><br>

    <button type="submit"> Update Room </button>
</form>

</body>
</html>
